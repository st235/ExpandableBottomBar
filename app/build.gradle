apply plugin: 'com.android.application'

android {
    namespace 'github.com.st235.expandablebottombar.app'

    defaultConfig {
        applicationId 'github.com.st235.expandablebottombar'
        minSdkVersion 21
        targetSdkVersion 37
        compileSdk 37
        versionCode 1
    }

    lint {
        baseline = file('lint-baseline.txt')
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        jvmToolchain(17)
    }
}

dependencies {
    implementation project(':expandablebottombar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.10'

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.8'

    implementation 'com.squareup.picasso:picasso:2.71828'
}
